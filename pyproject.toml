[project]
name = "nudge"
version = "0.1.0"
description = "Nudi — personal Telegram assistant. Talk like a human. Stay at five tasks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ilya Krivopustov" }]
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]==21.*",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pyairtable>=3.0",
    "pydantic-settings>=2.4",
]

[project.scripts]
nudge = "nudge.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nudge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits live Apify/Karakeep (skipped without tokens)",
]
